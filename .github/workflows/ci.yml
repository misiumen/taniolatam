name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, unit tests
        run: npm run check

      - name: Build
        run: npm run build

      # Browsers are installed in CI only; locally a system Chromium is used (PW_CHROMIUM_PATH).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # `next dev` with the mock source; no secrets or external services needed.
      - name: E2E (dev server)
        run: npm run e2e -w @taniolatam/web

      # The production build served the way Docker serves it (standalone + static assets).
      - name: E2E (production build)
        run: npm run e2e:prod -w @taniolatam/web

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/playwright-report-prod/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
