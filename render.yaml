# Render Blueprint: https://render.com/docs/blueprint-spec
# Wdrożenie: Render → New → Blueprint → wybierz repozytorium; Render odczyta ten plik.
services:
  - type: web
    name: gdziepolece
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /szukaj
    autoDeploy: true
    disk:
      name: cache
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "3000"
      # Canonical host: pages, canonical tags, sitemap and robots.txt use it; any other host (e.g.
      # gdziepolece.onrender.com) is served with X-Robots-Tag: noindex and "Disallow: /".
      - key: PUBLIC_SITE_URL
        value: https://gdziepolece.pl
      - key: SOURCE_MOCK
        value: "0"
      - key: SOURCE_TRAVELPAYOUTS
        value: "1"
      - key: TRAVELPAYOUTS_TOKEN
        sync: false
      - key: TRAVELPAYOUTS_MARKER
        sync: false
      # Duffel: ceny na żywo linii regularnych, płatne za wyszukiwanie; domyślnie wyłączone.
      # Włączenie: SOURCE_DUFFEL=1 + DUFFEL_ACCESS_TOKEN w panelu, DUFFEL_MODE=live dla tokenu
      # produkcyjnego. Limit dzienny chroni przed kosztami (licznik w cache SQLite na dysku /data).
      - key: SOURCE_DUFFEL
        value: "0"
      - key: DUFFEL_ACCESS_TOKEN
        sync: false
      - key: DUFFEL_MODE
        value: test
      - key: DUFFEL_DAILY_SEARCH_BUDGET
        value: "200"
      # Czartery (faza 3), domyślnie wyłączone. Na Renderze cron job nie widzi dysku usługi web,
      # więc import działa w procesie serwera: SOURCE_CHARTERS=1 + CHARTER_IMPORT_INTERVAL_MINUTES
      # (np. 360) + CHARTER_FEEDS_FILE (np. /data/charter-feeds.json). Sekrety feedów (nazwy z
      # auth.*.valueEnv w konfiguracji) dodaj w panelu jako zmienne bez wartości w repo.
      - key: SOURCE_CHARTERS
        value: "0"
      # Pusta = <repo>/config/charter-feeds.json; ustawiana w panelu (sync: false).
      - key: CHARTER_FEEDS_FILE
        sync: false
      - key: CHARTER_IMPORT_INTERVAL_MINUTES
        value: "0"
      - key: CACHE_DRIVER
        value: sqlite
      - key: CACHE_PATH
        value: /data/cache.sqlite
      # Twardy limit zapytań do źródeł na jedno wyszukiwanie (domyślnie 500).
      - key: SEARCH_MAX_TASKS
        value: "500"
      # Read at runtime by GET /api/v1/config (no Docker build arg needed).
      - key: MAP_STYLE_URL
        value: https://tiles.openfreemap.org/styles/liberty
